<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlfaBus | Account Deletion</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #c0392b;
        }
        button:disabled {
            background-color: #e5a49d;
            cursor: not-allowed;
        }
        .hidden {
            display: none;
        }
        .status-message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.4;
        }
        .error {
            color: #e74c3c;
        }
        .success {
            color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Delete AlfaBus Account</h2>
    <p>Are you sure you want to permanently delete your account? All booking history and passenger data will be erased. This action cannot be undone.</p>

    <button id="btn-delete" onclick="deleteAccount()">Yes, Delete My Account</button>
    
    <div id="status" class="status-message"></div>
</div>

<script>
    async function deleteAccount() {
        const btn = document.getElementById('btn-delete');
        const statusDiv = document.getElementById('status');
        
        // 1. Extract the JWT token from the URL (?token=...)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            // Hide the standard delete button
            btn.classList.add('hidden'); 
            
            // Show a manual email request fallback for Google Play compliance
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `
                <div style="color: #2c3e50; font-weight: normal; margin-bottom: 15px;">
                    To request account deletion without the app, please email our support team from your registered email address or provide your registered phone number.
                </div>
                <a href="mailto:support@alfabus.app?subject=Account%20Deletion%20Request" 
                   style="display: inline-block; width: 100%; padding: 14px; background-color: #34495e; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; box-sizing: border-box;">
                   Email Support to Delete Account
                </a>
            `;
            return;
        }

        // 2. Update UI to loading state
        btn.disabled = true;
        btn.innerText = "Processing Deletion...";
        showStatus('', ''); // Clear any previous status

        try {
            // 3. Call your Node.js backend using the token
            // 🚀 Be sure to replace this URL with your actual production API endpoint
            const response = await fetch('https://galore-scoff-camera.ngrok-free.dev/api/user/delete-account', {
                method: 'DELETE', // Matches your updated Express route
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` // Pass the token securely
                }
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.message || 'Failed to delete account.');
            }

            // 4. Handle Success
            btn.classList.add('hidden');
            showStatus('Your account and all associated data have been permanently deleted. You may now close this page.', 'success');

        } catch (error) {
            // 5. Handle Errors
            showStatus(error.message, 'error');
            btn.disabled = false;
            btn.innerText = "Yes, Delete My Account";
        }
    }

    // Helper function for rendering messages in the UI
    function showStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = message;
        statusDiv.className = `status-message ${type}`;
    }
</script>

</body>
</html>
