<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlfaBus | Account Deletion</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 13px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        input[readonly] {
            background-color: #ecf0f1;
            color: #7f8c8d;
            cursor: not-allowed;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #c0392b;
        }
        .hidden {
            display: none;
        }
        .status-message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .error {
            color: #e74c3c;
        }
        .success {
            color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Delete AlfaBus Account</h2>
    <p>Submit a request to permanently delete your account and all associated booking data. This action cannot be undone.</p>

    <!-- Step 1: Request OTP -->
    <div id="step-1">
        <div class="input-group">
            <label for="phone">Registered Mobile Number</label>
            <input type="text" id="phone" placeholder="e.g. 9999999999" maxlength="15">
        </div>
        <button id="btn-send-otp" onclick="requestOTP()">Send Verification OTP</button>
    </div>

    <!-- Step 2: Verify OTP -->
    <div id="step-2" class="hidden">
        <div class="input-group">
            <label for="otp">Enter 6-Digit OTP</label>
            <input type="text" id="otp" placeholder="123456" maxlength="6">
        </div>
        <button id="btn-verify-delete" onclick="verifyAndDelete()">Verify & Delete Account</button>
    </div>

    <div id="status" class="status-message"></div>
</div>

<script>
    // 1. Check URL for existing phone number on page load
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const urlPhone = urlParams.get('phone');
        const phoneInput = document.getElementById('phone');

        if (urlPhone) {
            phoneInput.value = urlPhone;
            phoneInput.readOnly = true; // Lock the field to prevent tampering
        }
    });

    // 2. Handle OTP Request
    async function requestOTP() {
        const phone = document.getElementById('phone').value.trim();
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('btn-send-otp');

        if (!phone) {
            showStatus('Please enter a valid mobile number.', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerText = "Sending...";

        try {
            // 🚀 REPLACE with your actual Node.js endpoint for sending OTP
            /*
            const response = await fetch('https://api.alfabus.com/api/auth/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Failed to send OTP');
            */

            // Simulation for now:
            await new Promise(resolve => setTimeout(resolve, 800)); 

            // Hide Step 1, Show Step 2
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            showStatus('An OTP has been sent to your number.', 'success');

        } catch (error) {
            showStatus(error.message, 'error');
            btn.disabled = false;
            btn.innerText = "Send Verification OTP";
        }
    }

    // 3. Handle Deletion Verification
    async function verifyAndDelete() {
        const phone = document.getElementById('phone').value;
        const otp = document.getElementById('otp').value.trim();
        const btn = document.getElementById('btn-verify-delete');

        if (!otp || otp.length < 4) {
            showStatus('Please enter a valid OTP.', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerText = "Processing Deletion...";

        try {
            // 🚀 REPLACE with your actual Node.js endpoint for deleting the user
            /*
            const response = await fetch('https://api.alfabus.com/api/user/delete-account', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, otp: otp })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Verification failed');
            */

            // Simulation for now:
            await new Promise(resolve => setTimeout(resolve, 1000));

            document.getElementById('step-2').classList.add('hidden');
            showStatus('Your account and all associated data have been permanently deleted.', 'success');

        } catch (error) {
            showStatus(error.message, 'error');
            btn.disabled = false;
            btn.innerText = "Verify & Delete Account";
        }
    }

    // Helper function for UI messages
    function showStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = message;
        statusDiv.className = `status-message ${type}`;
    }
</script>

</body>
</html>
